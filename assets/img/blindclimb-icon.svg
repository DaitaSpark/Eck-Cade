<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="18" fill="#ffd45a"/>
  <!-- antennae -->
  <path d="M28 22 L22 10" stroke="#17243c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M36 22 L42 10" stroke="#17243c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="10" r="2" fill="#17243c"/>
  <circle cx="42" cy="10" r="2" fill="#17243c"/>
  <!-- wings, folded down against the body -->
  <ellipse cx="20" cy="41" rx="12" ry="7" fill="#fff" stroke="#17243c" stroke-width="3" transform="rotate(-55 20 41)"/>
  <ellipse cx="44" cy="41" rx="12" ry="7" fill="#fff" stroke="#17243c" stroke-width="3" transform="rotate(55 44 41)"/>
  <!-- body -->
  <ellipse cx="32" cy="35" rx="8" ry="16" fill="#17243c"/>
  <circle cx="29" cy="28" r="2" fill="#fff"/>
  <circle cx="35" cy="28" r="2" fill="#fff"/>
</svg>
