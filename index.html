<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12071f" />
  <title>Eck-Cade</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="scanlines"></div>

  <header class="marquee">
    <h1 class="block-title" aria-label="Eck-Cade">
      <span class="letter c1">E</span><span class="letter c2">C</span><span class="letter c3">K</span><span class="letter dash">-</span><span class="letter c4">C</span><span class="letter c5">A</span><span class="letter c6">D</span><span class="letter c7">E</span>
    </h1>
    <p class="tagline">★ INSERT COIN TO PLAY ★</p>
  </header>

  <main>
    <!-- Add one <a class="game-card"> per game. Just point href at the game's URL. -->
    <section class="game-grid">
      <a class="game-card" href="https://blindclimb.onrender.com/" target="_blank" rel="noopener">
        <span class="art blinds-art" aria-hidden="true">
          <img src="assets/img/blindclimb-icon.svg" alt="" class="game-icon" />
        </span>
        <h2>BlindClimb</h2>
        <p>Race the rising lava!</p>
        <span class="by">GameMaster: Liam E</span>
      </a>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ by the Eck-Cade Kids &middot; <span id="year"></span></p>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
